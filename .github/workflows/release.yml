name: HyperFuzzer
run-name: HyperFuzzer v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Project version: (e.g. 26.1.0)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: package resource pack
        run: zip -r hyperfuzzer.zip assets pack.mcmeta
      - uses: Kir-Antipov/mc-publish@v3
        with:
          name: HyperFuzzer v${{ inputs.version }}
          version: ${{ inputs.version }}
          files: |
            hyperfuzzer.zip
          github-token: ${{ secrets.GITHUB_TOKEN }}
